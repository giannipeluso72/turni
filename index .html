function fetchConFallback(urlOnline, urlLocale) {
    const tenta = function(u) {
        return fetch(
            u + (u.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now(),
            { cache: "no-store" }
        );
    };
    const locale = function() {
        origini[urlLocale] = "copia nella cartella del sito";
        return tenta(urlLocale);
    };
    if (!urlOnline) { return locale(); }
    return tenta(urlOnline)
        .then(function(r) {
            const tipo = r.headers.get("content-type") || "";
            if (r.ok && !/text\/html/i.test(tipo)) {
                origini[urlLocale] = "file online (Google)";
                return r;
            }
            return locale();
        })
        .catch(function() { return locale(); });
}

async function apriPdfDaCartella(nome) {
    const nomi = [nome, normalizza(nome)];
    for (const n of nomi) {
        try {
            const r = await fetch(
                "pdf/" + encodeURIComponent(n) + ".pdf",
                { cache: "no-store" }
            );
            const tipo = r.headers.get("content-type") || "";
            if (r.ok && !/text\/html/i.test(tipo)) {
                const blob = await r.blob();
                window.open(URL.createObjectURL(blob), "_blank");
                return;
            }
        } catch (e) {}
    }
    alert(
        "Nessun PDF trovato per " + nome + ".\n" +
        "L'amministratore non lo ha ancora caricato."
    );
}

<script>
/* ============================================================
   TOTALE ORE + ASSENZE + FESTIVI PER OPERATORE
   Modifica qui i valori se cambiano le regole:
   ============================================================ */
(function () {
    var MIN_ASSENZA = 6 * 60 + 36;   /* ogni assenza vale 6:36 */
    var MIN_FESTIVO = 6 * 60 + 36;   /* festivo non lavorato pagato 6:36 */
    var FESTIVI_FISSI = ["01-01","01-06","04-25","05-01","06-02","08-15","11-01","12-08","12-25","12-26"];

    function pasquetta(anno) {
        var a = anno % 19, b = Math.floor(anno / 100), c = anno % 100;
        var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
        var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
        var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
        var m = Math.floor((a + 11 * h + 22 * l) / 451);
        var mese = Math.floor((h + l - 7 * m + 114) / 31);
        var giorno = ((h + l - 7 * m + 114) % 31) + 1;
        var d2 = new Date(anno, mese - 1, giorno + 1);
        return d2;
    }
    function chiave(d) {
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function eFestivo(d) {
        var mmgg = chiave(d).slice(5);
        if (FESTIVI_FISSI.indexOf(mmgg) !== -1) { return true; }
        return chiave(pasquetta(d.getFullYear())) === chiave(d);
    }
    function minDa(s) {
        var p = String(s || "").split(":");
        if (p.length < 2) { return 0; }
        return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    }
    function hhmm(min) {
        return Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0");
    }
    function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
    }

    function calcola(dal, al) {
        var ris = {};
        function op(n) {
            var k = normalizza(n);
            if (!ris[k]) { ris[k] = { nome: n, lav: 0, ass: 0, nAss: 0, fest: 0, nFest: 0, dAss: [], dFest: [] }; }
            return ris[k];
        }
        try { getOperatoriPin().forEach(function (o) { op(o.nome); }); } catch (e) {}
        Object.keys(turni).forEach(function (d) {
            Object.keys(turni[d]).forEach(function (p) { turni[d][p].forEach(function (t) { op(t.nome); }); });
        });
        Object.keys(assenze).forEach(function (d) {
            Object.keys(assenze[d]).forEach(function (p) { assenze[d][p].forEach(function (a) { op(a.nome); }); });
        });
        var giorno = new Date(dal + "T00:00:00"), fine = new Date(al + "T00:00:00");
        while (giorno <= fine) {
            var k = chiave(giorno), fest = eFestivo(giorno);
            var lavorato = {}, assente = {};
            if (turni[k]) {
                Object.keys(turni[k]).forEach(function (p) {
                    turni[k][p].forEach(function (t) {
                        var min = minDa(t.ore) || minDa(calcolaOre(t.entrata, t.uscita));
                        var o = op(t.nome);
                        o.lav += min;
                        lavorato[normalizza(t.nome)] = true;
                    });
                });
            }
            if (assenze[k]) {
                Object.keys(assenze[k]).forEach(function (p) {
                    assenze[k][p].forEach(function (a) {
                        if (normalizza(a.tipo) === "RIPOSO") { return; }
                        assente[normalizza(a.nome)] = a.tipo || "ASSENZA";
                    });
                });
            }
            Object.keys(ris).forEach(function (n) {
                if (lavorato[n]) { return; }
                if (fest) { ris[n].fest += MIN_FESTIVO; ris[n].nFest++; ris[n].dFest.push(k.slice(8) + "/" + k.slice(5, 7)); }
                else if (assente[n]) { ris[n].ass += MIN_ASSENZA; ris[n].nAss++; ris[n].dAss.push(k.slice(8) + "/" + k.slice(5, 7) + " " + assente[n]); }
            });
            giorno.setDate(giorno.getDate() + 1);
        }
        return Object.keys(ris).sort().map(function (k) { return ris[k]; });
    }

    function righe(dal, al) {
        return calcola(dal, al).map(function (o) {
            return [o.nome, hhmm(o.lav), o.nAss, hhmm(o.ass), o.nFest, hhmm(o.fest), hhmm(o.lav + o.ass + o.fest)];
        });
    }
    var INT = ["OPERATORE","ORE LAVORATE","N. ASSENZE","ORE ASSENZE","N. FESTIVI","ORE FESTIVI","TOTALE"];

    function mostra() {
        var dal = document.getElementById("totDal").value, al = document.getElementById("totAl").value;
        if (!dal || !al) { return; }
        var r = righe(dal, al);
        var h = "<table style='width:100%;border-collapse:collapse;font-size:14px'><tr>" +
            INT.map(function (t) { return "<th style='background:#1e3a8a;color:#fff;padding:6px;text-align:" + (t==="OPERATORE"?"left":"center") + "'>" + t + "</th>"; }).join("") + "</tr>";
        r.forEach(function (x) {
            h += "<tr>" + x.map(function (v, i) {
                return "<td style='padding:6px;border-bottom:1px solid #e5e7eb;text-align:" + (i===0?"left":"center") + ";" + (i===6?"font-weight:bold;":"") + "'>" + esc(v) + "</td>";
            }).join("") + "</tr>";
        });
        document.getElementById("totTabella").innerHTML = h + "</table>";
    }
    function scarica() {
        var dal = document.getElementById("totDal").value, al = document.getElementById("totAl").value;
        var ws = XLSX.utils.aoa_to_sheet([INT].concat(righe(dal, al)));
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "TOTALI");
        XLSX.writeFile(wb, "TOTALI_" + dal + "_" + al + ".xlsx");
    }
    function apri() {
        var m = document.getElementById("totModal");
        if (!m) {
            m = document.createElement("div");
            m.id = "totModal";
            m.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px";
            m.innerHTML = "<div style='background:#fff;color:#1f2937;border-radius:12px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:16px'>" +
                "<h2 style='margin:0 0 10px'>📊 TOTALE ORE, ASSENZE E FESTIVI</h2>" +
                "<div style='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px'>Dal <input type='date' id='totDal'> al <input type='date' id='totAl'>" +
                "<button id='totCalcola'>CALCOLA</button><button id='totExcel' class='btn-salva'>⬇ EXCEL</button><button id='totChiudi' class='btn-chiudi'>CHIUDI</button></div>" +
                "<div id='totTabella' style='overflow-x:auto'></div>" +
                "<p style='font-size:12px;color:#64748b'>Assenza = 6:36 · Festivo non lavorato = 6:36 · TOTALE = ore lavorate + assenze + festivi</p></div>";
            document.body.appendChild(m);
            var oggi = new Date();
            document.getElementById("totDal").value = chiave(new Date(oggi.getFullYear(), oggi.getMonth(), 1));
            document.getElementById("totAl").value = chiave(new Date(oggi.getFullYear(), oggi.getMonth() + 1, 0));
            document.getElementById("totCalcola").onclick = mostra;
            document.getElementById("totExcel").onclick = scarica;
            document.getElementById("totChiudi").onclick = function () { m.style.display = "none"; };
        }
        m.style.display = "flex";
        mostra();
    }

    /* ---- Totale sotto ai turni (vista operatore / filtro operatore / tutti) ---- */
    function periodoCorrente() {
        var oggi = new Date(); oggi.setHours(0, 0, 0, 0);
        if (modalita === "giorno") {
            var g = new Date(oggi); g.setDate(g.getDate() + offsetGiorno);
            return { dal: chiave(g), al: chiave(g), nome: "GIORNO" };
        }
        if (modalita === "mese") {
            var p = new Date(oggi.getFullYear(), oggi.getMonth() + offsetMese, 1);
            var u = new Date(p.getFullYear(), p.getMonth() + 1, 0);
            return { dal: chiave(p), al: chiave(u), nome: "MESE" };
        }
        var ds = oggi.getDay(), diff = ds === 0 ? -6 : 1 - ds;
        var lun = new Date(oggi); lun.setDate(lun.getDate() + diff + offsetSettimana * 7);
        var dom = new Date(lun); dom.setDate(dom.getDate() + 6);
        return { dal: chiave(lun), al: chiave(dom), nome: "SETTIMANA" };
    }
    function aggiungiTotale() {
        var cont = document.getElementById("risultati");
        if (!cont || !fileCaricato) { return; }
        var vecchio = document.getElementById("boxTotaleOre");
        if (vecchio) { vecchio.remove(); }
        /* Visibilità: l'amministratore vede tutto; l'operatore solo il proprio totale */
        var nome = amministratore ? nomeFiltroOperatore() : (modalitaPersonale && operatoreCorrente ? operatoreCorrente : null);
        if (!amministratore && !nome) { return; }
        var per = periodoCorrente(), tutti = calcola(per.dal, per.al);
        var box = document.createElement("div");
        box.id = "boxTotaleOre";
        box.style.cssText = "background:#fff;border-radius:14px;margin:18px 0;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.10)";
        var tit = "<div style='font-weight:bold;font-size:18px;color:#1e3a8a;margin-bottom:8px'>📊 TOTALE " + per.nome + "</div>";
        if (nome) {
            var o = tutti.filter(function (x) { return normalizza(x.nome) === normalizza(nome); })[0];
            if (!o) { return; }
            box.innerHTML = tit + "<div style='line-height:1.9'>" +
                "Ore lavorate: <b>" + hhmm(o.lav) + "</b><br>" +
                "Assenze (" + o.nAss + "): <b>" + hhmm(o.ass) + "</b>" + (o.dAss.length ? " <span style='color:#9a3412;font-size:13px'>— " + esc(o.dAss.join(", ")) + "</span>" : "") + "<br>" +
                "Festivi (" + o.nFest + "): <b>" + hhmm(o.fest) + "</b>" + (o.dFest.length ? " <span style='color:#475569;font-size:13px'>— " + o.dFest.join(", ") + "</span>" : "") + "<br>" +
                "<span style='font-size:18px'>TOTALE: <b>" + hhmm(o.lav + o.ass + o.fest) + "</b></span></div>";
        } else {
            var h = "<div style='overflow-x:auto'><table style='width:100%;border-collapse:collapse;font-size:14px'><tr>" +
                INT.map(function (t) { return "<th style='background:#1e3a8a;color:#fff;padding:6px;text-align:" + (t === "OPERATORE" ? "left" : "center") + "'>" + t + "</th>"; }).join("") + "</tr>";
            tutti.forEach(function (o) {
                var r = [o.nome, hhmm(o.lav), o.nAss, hhmm(o.ass), o.nFest, hhmm(o.fest), hhmm(o.lav + o.ass + o.fest)];
                h += "<tr>" + r.map(function (v, i) { return "<td style='padding:6px;border-bottom:1px solid #e5e7eb;text-align:" + (i === 0 ? "left" : "center") + ";" + (i === 6 ? "font-weight:bold;" : "") + "'>" + esc(v) + "</td>"; }).join("") + "</tr>";
            });
            box.innerHTML = tit + h + "</table></div>";
        }
        cont.appendChild(box);
    }
    var visualizzaOriginale = visualizza;
    visualizza = function () {
        visualizzaOriginale.apply(this, arguments);
        try { aggiungiTotale(); } catch (e) { console.warn("Totale non calcolato", e); }
    };
    try { if (fileCaricato) { visualizza(); } } catch (e) {}

    var rif = document.getElementById("btnGestisciPin");
    if (rif && rif.parentNode) {
        var b = document.createElement("button");
        b.className = "btn-admin";
        b.textContent = "📊 TOTALE ORE";
        b.addEventListener("click", apri);
        rif.parentNode.insertBefore(b, rif.nextSibling);
    }
})();
</script>

<script>
/* ============================================================
   NOTIFICHE ASSENZE / RICHIESTE
   - Admin: avviso all'accesso e quando arrivano nuove richieste
     (anche dopo IMPORTA RICHIESTE DA EXCEL), contatore nel titolo
     della scheda, notifica del browser e suono.
   - Operatore: avviso all'accesso se una sua richiesta e' stata
     APPROVATA o RIFIUTATA dall'ultima volta.
   Nota: i dati restano in localStorage di questo dispositivo.
   ============================================================ */
(function () {
    var TITOLO_BASE = "TURNI POSTE NAPOLI";
    var CATEGORIE_ASSENZA = ["FERIE", "104", "MALATTIA", "ALTRA ASSENZA"];
    var ultimoPendenti = null;

    function pendenti() {
        return (richieste || []).filter(function (r) { return r.stato === "IN ATTESA"; });
    }

    function suono() {
        try {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = 880; g.gain.value = 0.08;
            o.start(); o.stop(ctx.currentTime + 0.25);
        } catch (e) {}
    }

    function notificaBrowser(titolo, testo) {
        try {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(titolo, { body: testo });
            }
        } catch (e) {}
    }

    function banner(testo) {
        var b = document.getElementById("bannerNotifiche");
        if (!b) {
            b = document.createElement("div");
            b.id = "bannerNotifiche";
            b.style.cssText = "position:fixed;top:10px;left:50%;transform:translateX(-50%);" +
                "z-index:10000;background:#dc2626;color:#fff;padding:12px 18px;border-radius:10px;" +
                "font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;max-width:92%;text-align:center;";
            b.addEventListener("click", function () { b.style.display = "none"; });
            document.body.appendChild(b);
        }
        b.textContent = "🔔 " + testo;
        b.style.display = "block";
        clearTimeout(b._t);
        b._t = setTimeout(function () { b.style.display = "none"; }, 12000);
    }

    function riepilogoAdmin() {
        var p = pendenti();
        var assenze = p.filter(function (r) { return CATEGORIE_ASSENZA.indexOf(r.tipo) !== -1; });
        var cambi = p.length - assenze.length;
        return { tot: p.length, assenze: assenze.length, cambi: cambi };
    }

    function aggiornaTitolo() {
        if (!amministratore) { document.title = TITOLO_BASE; return; }
        var n = pendenti().length;
        document.title = (n > 0 ? "(" + n + ") " : "") + TITOLO_BASE;
    }

    /* Avviso all'accesso dell'amministratore */
    function avvisoAccessoAdmin() {
        var r = riepilogoAdmin();
        if (r.tot === 0) { return; }
        var html = "<p><strong>" + r.assenze + "</strong> richieste di assenza in attesa " +
            "(ferie, 104, malattia, altre assenze).</p>" +
            (r.cambi ? "<p><strong>" + r.cambi + "</strong> richieste di cambio turno in attesa.</p>" : "") +
            "<div class=\"modal-buttons\"><button class=\"btn-richiesta\" " +
            "onclick=\"chiudiModal();apriRichieste(null);\">📋 APRI RICHIESTE</button></div>";
        apriModal("🔔 NOTIFICHE ASSENZE", html);
        notificaBrowser("Turni Poste Napoli", r.tot + " richieste in attesa");
    }

    /* Avviso all'accesso dell'operatore: esito delle sue richieste */
    function avvisoAccessoOperatore(nome) {
        if (!nome) { return; }
        var chiave = "notifiche_viste_" + nome;
        var viste = {};
        try { viste = JSON.parse(localStorage.getItem(chiave) || "{}"); } catch (e) {}
        var mie = (richieste || []).filter(function (r) { return r.operatore === nome; });
        var nuove = mie.filter(function (r) {
            return r.stato !== "IN ATTESA" && viste[r.id] !== r.stato;
        });
        mie.forEach(function (r) { viste[r.id] = r.stato; });
        try { localStorage.setItem(chiave, JSON.stringify(viste)); } catch (e) {}
        if (!nuove.length) { return; }
        var html = nuove.map(function (r) {
            var ok = r.stato === "APPROVATA";
            return "<p>" + (ok ? "✅" : "❌") + " <strong>" + escapeHtml(r.tipo) + "</strong>" +
                (r.dal ? " dal " + escapeHtml(r.dal) + " al " + escapeHtml(r.al) : "") +
                (r.data ? " del " + escapeHtml(r.data) : "") +
                ": <strong>" + escapeHtml(r.stato) + "</strong></p>";
        }).join("");
        apriModal("🔔 ESITO DELLE TUE RICHIESTE", html);
        suono();
    }

    /* Aggancio: contatori (si aggiornano dopo ogni modifica/importazione) */
    var originaleContatori = aggiornaContatoriRichieste;
    aggiornaContatoriRichieste = function () {
        originaleContatori.apply(this, arguments);
        aggiornaTitolo();
        if (!amministratore) { ultimoPendenti = null; return; }
        var n = pendenti().length;
        if (ultimoPendenti !== null && n > ultimoPendenti) {
            var diff = n - ultimoPendenti;
            banner(diff + (diff === 1 ? " nuova richiesta in attesa" : " nuove richieste in attesa"));
            notificaBrowser("Turni Poste Napoli", diff + " nuove richieste in attesa");
            suono();
        }
        ultimoPendenti = n;
    };

    /* Aggancio: accesso amministratore */
    var originaleAdmin = entraComeAmministratore;
    entraComeAmministratore = function () {
        originaleAdmin.apply(this, arguments);
        if (amministratore) {
            ultimoPendenti = pendenti().length;
            aggiornaTitolo();
            if ("Notification" in window && Notification.permission === "default") {
                try { Notification.requestPermission(); } catch (e) {}
            }
            avvisoAccessoAdmin();
        }
    };

    /* Aggancio: accesso operatore */
    var originaleOperatore = entraComeOperatorePersonale;
    entraComeOperatorePersonale = function (nome) {
        originaleOperatore.apply(this, arguments);
        setTimeout(function () { avvisoAccessoOperatore(nome); }, 400);
    };

    /* Se un'altra scheda dello stesso browser modifica le richieste, ricarica e avvisa */
    window.addEventListener("storage", function (e) {
        if (e.key !== CHIAVE_RICHIESTE || !amministratore) { return; }
        try {
            richieste = JSON.parse(e.newValue || "[]");
            aggiornaContatoriRichieste();
        } catch (err) {}
    });
})();
</script>

<script>
/* ============================================================
   INVIO RICHIESTE AL FOGLIO GOOGLE (Apps Script)
   Incolla qui sotto l'URL ottenuto da "Distribuisci" in Apps Script.
   Se resta vuoto, la pagina funziona come prima.
   ============================================================ */
const URL_INVIO_RICHIESTE = "https://script.google.com/macros/s/AKfycbygnb6tEsN3-lSnpZJHoysNJFPpQxB-m-RHEvNEhepxyZ21uMth3Gyisoh_b72CBiEcqQ/exec";

(function () {
    var CH = "sync_richieste_stati";
    function letti() { try { return JSON.parse(localStorage.getItem(CH) || "{}"); } catch (e) { return {}; } }
    function scrivi(o) { try { localStorage.setItem(CH, JSON.stringify(o)); } catch (e) {} }

    function invia(azione, lista, fatto) {
        if (!URL_INVIO_RICHIESTE || !lista.length) { return; }
        fetch(URL_INVIO_RICHIESTE, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ azione: azione, richieste: lista })
        }).then(fatto).catch(function () {});
    }

    function sincronizza() {
        if (!URL_INVIO_RICHIESTE) { return; }
        var stati = letti();
        var righe = richiesteComeRighe();
        var nuove = righe.filter(function (r) {
            if (stati[r.ID] !== undefined) { return false; }
            /* l'operatore invia solo le proprie; l'amministratore tutte */
            return amministratore || r.OPERATORE === operatoreCorrente;
        });
        var cambiate = righe.filter(function (r) {
            return amministratore && stati[r.ID] !== undefined && stati[r.ID] !== r.STATO;
        });
        invia("nuova", nuove, function () {
            var s = letti(); nuove.forEach(function (r) { s[r.ID] = r.STATO; }); scrivi(s);
        });
        invia("aggiorna", cambiate, function () {
            var s = letti(); cambiate.forEach(function (r) { s[r.ID] = r.STATO; }); scrivi(s);
        });
    }

    var originale = salvaRichiesteLocali;
    salvaRichiesteLocali = function () {
        originale.apply(this, arguments);
        sincronizza();
    };
})();
</script>

<script>
/* ============================================================
   PIN OPERATORI ONLINE (Firebase Firestore)
   Incolla qui il blocco firebaseConfig di Firebase, cosi':
   const FIREBASE_CONFIG = { apiKey: "...", projectId: "...", ... };
   Se resta null, i PIN funzionano come prima (solo su questo dispositivo).
   Quando e' attivo: cambi un PIN e vale subito su tutti i dispositivi,
   senza scaricare/ricaricare operatori.json.
   ============================================================ */
const FIREBASE_CONFIG = null;

(function () {
    if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.projectId) { return; }

    var VERSIONE = "10.12.2";
    var BASE = "https://www.gstatic.com/firebasejs/" + VERSIONE + "/";
    var db = null;

    function carica(src) {
        return new Promise(function (ok, ko) {
            var s = document.createElement("script");
            s.src = src; s.onload = ok; s.onerror = ko;
            document.head.appendChild(s);
        });
    }

    function riferimento() { return db.collection("config").doc("operatori"); }

    function leggiLocale() { try { return getOperatoriPin(); } catch (e) { return []; } }

    function applicaOnline(json) {
        try {
            var lista = JSON.parse(json);
            if (!Array.isArray(lista)) { return; }
            localStorage.setItem(CHIAVE_OPERATORI, JSON.stringify(lista));
            if (typeof aggiornaSelectOperatori === "function") { try { aggiornaSelectOperatori(); } catch (e) {} }
        } catch (e) {}
    }

    function pubblica(lista) {
        if (!db) { return; }
        riferimento().set({ json: JSON.stringify(lista), aggiornato: new Date().toISOString() })
            .catch(function () { alert("PIN salvati solo su questo dispositivo: Firebase non risponde."); });
    }

    carica(BASE + "firebase-app-compat.js")
        .then(function () { return carica(BASE + "firebase-firestore-compat.js"); })
        .then(function () {
            firebase.initializeApp(FIREBASE_CONFIG);
            db = firebase.firestore();

            /* ogni salvataggio dei PIN va anche online */
            var originale = salvaOperatoriPin;
            salvaOperatoriPin = function (lista) {
                originale.apply(this, arguments);
                pubblica(lista);
            };

            /* leggo i PIN online (con un breve ritardo, dopo il caricamento della pagina) */
            setTimeout(function () {
                riferimento().get().then(function (doc) {
                    if (doc.exists) {
                        applicaOnline(doc.data().json);
                    }
                    /* aggiornamenti in tempo reale (altri dispositivi) */
                    riferimento().onSnapshot(function (d) {
                        if (d.exists && !d.metadata.hasPendingWrites) { applicaOnline(d.data().json); }
                    });
                }).catch(function () {});
            }, 1500);

            /* primo avvio: se online non c'e' nulla, l'amministratore carica i PIN che ha qui */
            var originaleAdmin = entraComeAmministratore;
            entraComeAmministratore = function () {
                originaleAdmin.apply(this, arguments);
                if (!amministratore) { return; }
                riferimento().get().then(function (doc) {
                    var locale = leggiLocale();
                    if (!doc.exists && locale.length) { pubblica(locale); }
                }).catch(function () {});
            };
        })
        .catch(function () { console.warn("Firebase non caricato: PIN solo locali."); });
})();
</script>

<script>
/* ============================================================
   L'OPERATORE CAMBIA IL PROPRIO PIN
   ============================================================ */
(function () {
    function apriCambioMioPin() {
        if (!operatoreCorrente) { return; }
        var avviso = (typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG)
            ? ""
            : "<p style='color:#b45309;font-weight:bold;'>Attenzione: il nuovo PIN vale solo su questo dispositivo. " +
              "Per averlo ovunque deve essere attivo Firebase.</p>";
        apriModal("🔑 CAMBIA IL MIO PIN",
            avviso +
            "<div class='form-grid'>" +
            "<div class='form-group'><label>PIN attuale</label>" +
            "<input id='mpAttuale' type='password' inputmode='numeric' maxlength='6' autocomplete='off'></div>" +
            "<div class='form-group'><label>Nuovo PIN (da 4 a 6 cifre)</label>" +
            "<input id='mpNuovo' type='password' inputmode='numeric' maxlength='6' autocomplete='off'></div>" +
            "<div class='form-group'><label>Ripeti il nuovo PIN</label>" +
            "<input id='mpConferma' type='password' inputmode='numeric' maxlength='6' autocomplete='off'></div>" +
            "</div><div class='modal-buttons'>" +
            "<button class='btn-salva' onclick='salvaMioPin()'>💾 SALVA IL NUOVO PIN</button></div>");
    }

    window.salvaMioPin = function () {
        var att = testo(document.getElementById("mpAttuale").value);
        var nuovo = testo(document.getElementById("mpNuovo").value);
        var conf = testo(document.getElementById("mpConferma").value);
        var lista = getOperatoriPin();
        var io = lista.find(function (op) { return normalizza(op.nome) === normalizza(operatoreCorrente); });
        if (!io || io.pin !== att) { alert("Il PIN attuale non è corretto."); return; }
        if (!/^[0-9]{4,6}$/.test(nuovo)) { alert("Il nuovo PIN deve avere da 4 a 6 cifre, solo numeri."); return; }
        if (nuovo !== conf) { alert("I due nuovi PIN non coincidono."); return; }
        if (nuovo === att) { alert("Il nuovo PIN deve essere diverso da quello attuale."); return; }
        io.pin = nuovo;
        salvaOperatoriPin(lista);
        chiudiModal();
        alert("PIN cambiato. Dal prossimo accesso usa il nuovo PIN.");
    };

    var originale = entraComeOperatorePersonale;
    entraComeOperatorePersonale = function (nome) {
        originale.apply(this, arguments);
        setTimeout(function () {
            var riga = document.getElementById("rigaRichiesteOperatore");
            if (riga && !document.getElementById("btnCambiaMioPin")) {
                var b = document.createElement("button");
                b.id = "btnCambiaMioPin";
                b.className = "btn-chiudi";
                b.textContent = "🔑 CAMBIA IL MIO PIN";
                b.addEventListener("click", apriCambioMioPin);
                riga.appendChild(b);
            }
        }, 100);
    };
})();
</script>
