<style>

* {

body {

</style>

<script>

/* ============================================================
   VARIABILI GLOBALI
   ============================================================ */

let turni = {};

let chiusure = {};

let assenze = {};

let richieste = [];

let fileCaricato = false;

let workbookCaricato = null;

let nomeFileOriginale = "";

let amministratore = false;

let ruolo = null;

let modalita = "settimana";

let offsetSettimana = 0;

let offsetGiorno = 0;

let operatoreCorrente = null;

let modalitaPersonale = false;

let filtroPostazione = "tutte";

let filtroOperatore = "tutti";

let offsetMese = 0;

const PASSWORD_AMMINISTRATORE = "1234";

/* Indirizzo online dell'Excel dei turni (es. GitHub).
   Se vuoto, l'app legge turni.xlsx dalla cartella del sito. */
const URL_TURNI_ONLINE = "https://docs.google.com/spreadsheets/d/1M1ZR4m955y3CyJMdnwQ05B43kVYiyCypQ8fE3PJY7Ho/export?format=xlsx";

/* false = l'app legge SOLO i fogli "delGGMMAAAA" (consigliato).
   true  = usa anche i fogli APP_TURNI / APP_ASSENZE salvati in passato,
   che sostituirebbero i turni originali. */
const USA_SALVATAGGI_APP = false;

const origini = {};

/* Indirizzo online di operatori.json (facoltativo). */
const URL_OPERATORI_ONLINE = "";

const CHIAVE_OPERATORI =
    "turni_poste_napoli_operatori_pin_v1";

const CHIAVE_PDF_OPERATORI =
    "turni_poste_napoli_pdf_operatori_v1";

const CHIAVE_RICHIESTE =
    "turni_poste_napoli_richieste_v1";

const CHIAVE_VISUALIZZAZIONE =
    "turni_poste_napoli_visualizzazione_v1";

const CHIAVE_DATI =
    "turni_poste_napoli_dati_v1";

const CHIAVE_PASSWORD =
    "turni_poste_napoli_password_v1";


/* ============================================================
   POSTAZIONI
   ============================================================ */

const postazioni = [

    {
        id: "matteotti",
        nome: "Poste Napoli Piazza Matteotti",
        prima: 0,
        ultima: 5
    },

    {
        id: "monteoliveto",
        nome: "Poste Napoli Piazza Monteoliveto",
        prima: 7,
        ultima: 12
    },

    {
        id: "ferraris",
        nome: "Poste Napoli Via Galileo Ferraris",
        prima: 14,
        ultima: 19
    },

    {
        id: "lucci",
        nome: "Poste Napoli Arnaldo Lucci",
        prima: 21,
        ultima: 26
    }

];


/* ============================================================
   UTILITÀ
   ============================================================ */

function generaIdTurno() {

    return "APP_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,9);

}


function escapeHtml(valore) {

    return String(valore ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function dataArchivio(valore) {

    const s = testo(valore);

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(s)
    ) {
        return s;
    }

    return leggiData(s);

}


function postazionePerId(id) {

    return postazioni.find(
        function(p) {
            return p.id === id;
        }
    );

}


/* ============================================================
   DATA DAL NOME DEL FOGLIO
   ESEMPIO: del27092026
   ============================================================ */

function dataDaNomeFoglio(nomeFoglio) {

    const m =
        String(nomeFoglio)
            .match(
                /^del(\d{2})(\d{2})(\d{4})/i
            );

    if (!m) {
        return null;
    }

    const d =
        new Date(
            parseInt(m[3],10),
            parseInt(m[2],10) - 1,
            parseInt(m[1],10)
        );

    if (isNaN(d.getTime())) {
        return null;
    }

    return formatData(d);

}


/* ============================================================
   CARICAMENTO EXCEL
   ============================================================ */

document
    .getElementById("fileExcel")
    .addEventListener(
        "change",
        caricaExcel
    );


function caricaExcel(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const stato =
        document.getElementById("stato");

    stato.textContent =
        "Caricamento del file in corso...";

    const reader =
        new FileReader();

    reader.onload =
        function(e) {

            try {

                const datiFile =
                    new Uint8Array(
                        e.target.result
                    );

                const workbook =
                    XLSX.read(
                        datiFile,
                        {
                            type: "array",
                            cellDates: false,
                            raw: true
                        }
                    );

                workbookCaricato =
                    workbook;

                nomeFileOriginale =
                    file.name;

                turni = {};
                chiusure = {};
                assenze = {};

                fileCaricato = false;

                let numeroFogli = 0;

                let numeroTurni = 0;

                workbook.SheetNames.forEach(
                    function(nomeFoglio) {

                        if (
                            !/^del\d{8}/i
                                .test(nomeFoglio)
                        ) {
                            return;
                        }

                        const ws =
                            workbook.Sheets[
                                nomeFoglio
                            ];

                        if (!ws) {
                            return;
                        }

                        const dati =
                            XLSX.utils.sheet_to_json(
                                ws,
                                {
                                    header: 1,
                                    defval: "",
                                    raw: true
                                }
                            );

                        if (
                            !dati ||
                            !dati.length
                        ) {
                            return;
                        }

                        numeroFogli++;

                        leggiFoglio(
                            dati,
                            nomeFoglio
                        );

                    }
                );


                /* ---------------------------------------------
                   CARICA EVENTUALI MODIFICHE GIÀ SALVATE
                   --------------------------------------------- */

                caricaTurniSalvati(
                    workbook
                );

                caricaAssenzeSalvate(
                    workbook
                );

                caricaRichiesteSalvate(workbook);
                caricaOperatoriEPdfDalWorkbook(workbook);


                Object.keys(turni)
                    .forEach(
                        function(data) {

                            const giorno =
                                turni[data];

                            Object.keys(giorno)
                                .forEach(
                                    function(id) {

                                        numeroTurni +=
                                            giorno[id].length;

                                    }
                                );

                        }
                    );


                fileCaricato = true;


                stato.textContent =
                    "File caricato correttamente. " +
                    numeroFogli +
                    " fogli elaborati - " +
                    numeroTurni +
                    " turni caricati." +
                    (origini["turni.xlsx"] ? " Fonte: " + origini["turni.xlsx"] + "." : "");


                salvaDatiLocali();

                caricaVisualizzazioneSalvata();

                aggiornaContatoriRichieste();

                visualizza();

            }
            catch (errore) {

                console.error(errore);

                stato.textContent =
                    "ERRORE durante il caricamento del file Excel.";

                alert(
                    "Errore nella lettura del file Excel.\n\n" +
                    errore.message
                );

            }

        };


    reader.onerror =
        function() {

            stato.textContent =
                "Errore nella lettura del file.";

        };


    reader.readAsArrayBuffer(file);

}


/* ============================================================
   LEGGI FOGLIO
   ============================================================ */

function leggiFoglio(
    dati,
    nomeFoglio
) {

    const dataFoglio =
        dataDaNomeFoglio(nomeFoglio);

    for (
        let i = 0;
        i < postazioni.length;
        i++
    ) {

        leggiPostazione(
            dati,
            postazioni[i],
            dataFoglio
        );

    }

}


/* ============================================================
   LEGGI POSTAZIONE
   ============================================================ */

function leggiPostazione(
    dati,
    postazione,
    dataFoglio
) {

    /*
       IMPORTANTE:
       Se il foglio è del27092026, la data viene
       comunque assegnata anche se nella riga Matteotti
       la data non è presente nelle colonne A:F.

       Questa è la correzione della domenica Matteotti.
    */

    let dataCorrente =
        dataFoglio || null;


    for (
        let r = 0;
        r < dati.length;
        r++
    ) {

        const riga =
            dati[r] || [];


        /* ====================================================
           CERCA DATA
           ==================================================== */

        let nuovaData = null;

        for (
            let c = postazione.prima;
            c <= postazione.ultima;
            c++
        ) {

            const valore =
                testo(riga[c]);

            const dataTrovata =
                leggiData(valore);

            if (dataTrovata) {

                nuovaData =
                    dataTrovata;

                break;

            }

        }


        if (nuovaData) {

            dataCorrente =
                nuovaData;

        }


        if (!dataCorrente) {
            continue;
        }


        /* ====================================================
           ASSENZE
           ==================================================== */

        let noteAssenza = [];


        for (
            let c = postazione.prima;
            c <= postazione.ultima;
            c++
        ) {

            const valore =
                testo(riga[c]);


            if (!valore) {
                continue;
            }


            const valoreNorm =
                normalizza(valore);


            if (
                leggiData(valore)
            ) {
                continue;
            }


            if (
                leggiOra(valore)
            ) {
                continue;
            }


            if (
                valoreNorm === "TOTALE" ||
                valoreNorm.indexOf(
                    "TOTALE "
                ) === 0
            ) {

                continue;

            }


            if (
                valoreNorm ===
                "SITO CHIUSO"
            ) {

                continue;

            }


            /*
               CORREZIONE IMPORTANTE:
               ora vengono riconosciute anche celle
               che contengono ESATTAMENTE FERIE,
               RIPOSO, MALATTIA o 104.
            */

            const contieneAssenza =
                /\bFERIE\b|\bRIPOSO\b|\bMALATTIA\b|\b104\b|\bLEGGE\s*104\b/i
                    .test(valoreNorm);


            if (!contieneAssenza) {
                continue;
            }


            const parti =
                valore.split(",");


            for (
                let p = 0;
                p < parti.length;
                p++
            ) {

                let nota =
                    testo(
                        parti[p]
                    );


                if (!nota) {
                    continue;
                }


                const notaNorm =
                    normalizza(nota);


                let tipo = "";


                if (
                    notaNorm.indexOf(
                        "FERIE"
                    ) !== -1
                ) {

                    tipo = "FERIE";

                }

                else if (
                    notaNorm.indexOf(
                        "RIPOSO"
                    ) !== -1
                ) {

                    tipo = "RIPOSO";

                }

                else if (
                    notaNorm.indexOf(
                        "MALATTIA"
                    ) !== -1
                ) {

                    tipo = "MALATTIA";

                }

                else if (
                    notaNorm.indexOf(
                        "LEGGE 104"
                    ) !== -1 ||
                    notaNorm.indexOf(
                        "104"
                    ) !== -1
                ) {

                    tipo = "104";

                }


                if (!tipo) {
                    continue;
                }


                let nomeAssente =
                    nota;


                nomeAssente =
                    nomeAssente
                        .replace(
                            /\bLEGGE\s*104\b/ig,
                            ""
                        )
                        .replace(
                            /\bFERIE\b/ig,
                            ""
                        )
                        .replace(
                            /\bRIPOSO\b/ig,
                            ""
                        )
                        .replace(
                            /\bMALATTIA\b/ig,
                            ""
                        )
                        .replace(
                            /\b104\b/ig,
                            ""
                        )
                        .trim();


                nomeAssente =
                    nomeAssente
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim();


                if (nomeAssente) {

                    noteAssenza.push({

                        nome:
                            nomeAssente,

                        tipo:
                            tipo

                    });

                }

            }

        }


        /* ====================================================
           SALVA ASSENZE
           ==================================================== */

        if (
            noteAssenza.length > 0
        ) {

            if (
                !assenze[dataCorrente]
            ) {

                assenze[dataCorrente] =
                    {};

            }


            if (
                !assenze[dataCorrente]
                    [postazione.id]
            ) {

                assenze[dataCorrente]
                    [postazione.id] = [];

            }


            for (
                let a = 0;
                a < noteAssenza.length;
                a++
            ) {

                const assenza =
                    noteAssenza[a];


                const giaPresente =
                    assenze[dataCorrente]
                        [postazione.id]
                        .some(
                            function(x) {

                                return (

                                    normalizza(
                                        x.nome
                                    ) ===
                                    normalizza(
                                        assenza.nome
                                    )

                                    &&

                                    normalizza(
                                        x.tipo
                                    ) ===
                                    normalizza(
                                        assenza.tipo
                                    )

                                );

                            }
                        );


                if (
                    !giaPresente
                ) {

                    assenze[dataCorrente]
                        [postazione.id]
                        .push(
                            assenza
                        );

                }

            }

        }


        /* ====================================================
           SITO CHIUSO
           ==================================================== */

        let sitoChiuso = false;

        for (
            let c = postazione.prima;
            c <= postazione.ultima;
            c++
        ) {

            const valore =
                normalizza(
                    riga[c]
                );

            if (
                valore ===
                "SITO CHIUSO"
            ) {

                sitoChiuso = true;

                break;

            }

        }


        if (sitoChiuso) {

            if (
                !chiusure[dataCorrente]
            ) {

                chiusure[dataCorrente] =
                    {};

            }


            chiusure[dataCorrente]
                [postazione.id] = true;


            if (
                turni[dataCorrente] &&
                turni[dataCorrente]
                    [postazione.id]
            ) {

                turni[dataCorrente]
                    [postazione.id] = [];

            }


            continue;

        }


        if (
            chiusure[dataCorrente] &&
            chiusure[dataCorrente]
                [postazione.id]
        ) {

            continue;

        }


        /* ====================================================
           ENTRATA / USCITA
           ==================================================== */

        let indiceEntrata = -1;

        let indiceUscita = -1;

        let entrata = null;

        let uscita = null;


        for (
            let c = postazione.prima;
            c <= postazione.ultima;
            c++
        ) {

            const ora =
                leggiOra(
                    riga[c]
                );


            if (ora) {

                if (
                    indiceEntrata === -1
                ) {

                    indiceEntrata = c;

                    entrata = ora;

                }

                else if (
                    indiceUscita === -1
                ) {

                    indiceUscita = c;

                    uscita = ora;

                }

            }

        }




        /* ====================================================
           SE NON CI SONO DUE ORARI
           ==================================================== */

        if (
            indiceEntrata === -1 ||
            indiceUscita === -1
        ) {

            continue;

        }


        /* ====================================================
           CERCA NOME
           ==================================================== */

        let nome = "";


        for (
            let c = postazione.prima;
            c < indiceEntrata;
            c++
        ) {

            const valore =
                testo(riga[c]);


            if (!valore) {
                continue;
            }


            if (
                leggiData(valore)
            ) {
                continue;
            }


            const valoreNorm =
                normalizza(
                    valore
                );


            if (
                valoreNorm ===
                "TOTALE" ||

                valoreNorm.indexOf(
                    "TOTALE "
                ) === 0
            ) {

                continue;

            }


            if (
                valoreNorm ===
                "RIPOSO" ||

                valoreNorm ===
                "FERIE" ||

                valoreNorm ===
                "MALATTIA" ||

                valoreNorm ===
                "104" ||

                valoreNorm ===
                "LEGGE 104"
            ) {

                continue;

            }


            if (!nome) {

                nome = valore;

            }

            else {

                nome +=
                    " " + valore;

            }

        }


        nome =
            testo(nome);


        if (!nome) {
            continue;
        }


        const nomeNorm =
            normalizza(nome);


        if (
            nomeNorm ===
            "RIPOSO" ||

            nomeNorm ===
            "FERIE" ||

            nomeNorm ===
            "MALATTIA" ||

            nomeNorm ===
            "104" ||

            nomeNorm ===
            "LEGGE 104" ||

            nomeNorm ===
            "TOTALE"
        ) {

            continue;

        }


        if (
            entrata === "00:00" &&
            uscita === "00:00"
        ) {

            continue;

        }


        /* ====================================================
           ORE
           ==================================================== */

        let ore = null;


        for (
            let c = indiceUscita + 1;
            c <= postazione.ultima;
            c++
        ) {

            const possibileOre =
                leggiOra(
                    riga[c]
                );


            if (
                possibileOre
            ) {

                ore =
                    possibileOre;

                break;

            }

        }


        if (!ore) {

            ore =
                calcolaOre(
                    entrata,
                    uscita
                );

        }


        /* ====================================================
           CREA STRUTTURA
           ==================================================== */

        if (
            !turni[dataCorrente]
        ) {

            turni[dataCorrente] =
                {};

        }


        if (
            !turni[dataCorrente]
                [postazione.id]
        ) {

            turni[dataCorrente]
                [postazione.id] = [];

        }


        const lista =
            turni[dataCorrente]
                [postazione.id];


        const duplicato =
            lista.some(
                function(t) {

                    return (

                        normalizza(
                            t.nome
                        ) ===
                        normalizza(
                            nome
                        )

                        &&

                        t.entrata ===
                        entrata

                        &&

                        t.uscita ===
                        uscita

                    );

                }
            );


        if (
            duplicato
        ) {

            continue;

        }


        lista.push({

            id:
                "SRC_" +
                dataCorrente +
                "_" +
                postazione.id +
                "_" +
                r +
                "_" +
                indiceEntrata,

            nome:
                nome,

            entrata:
                entrata,

            uscita:
                uscita,

            ore:
                ore

        });

    }

}


/* ============================================================
   CARICA TURNI SALVATI
   ============================================================ */

function caricaTurniSalvati(workbook) {

    if (!USA_SALVATAGGI_APP) { return; }

    const ws =
        workbook.Sheets[
            "APP_TURNI"
        ];

    if (!ws) {
        return;
    }


    const dati =
        XLSX.utils.sheet_to_json(
            ws,
            {
                defval: "",
                raw: false
            }
        );


    if (!dati.length) {
        return;
    }


    /*
       Se esiste APP_TURNI significa che quello è
       lo stato modificato dall'amministratore.
    */

    turni = {};


    dati.forEach(
        function(riga) {

            const data =
                dataArchivio(
                    riga.DATA
                );

            if (!data) {
                return;
            }


            const postazione =
                testo(
                    riga.POSTAZIONE
                );


            if (!postazione) {
                return;
            }


            if (!turni[data]) {
                turni[data] = {};
            }


            if (!turni[data][postazione]) {
                turni[data][postazione] = [];
            }


            turni[data][postazione]
                .push({

                    id:
                        testo(
                            riga.ID
                        ) ||
                        generaIdTurno(),

                    nome:
                        testo(
                            riga.NOME
                        ),

                    entrata:
                        testo(
                            riga.ENTRATA
                        ),

                    uscita:
                        testo(
                            riga.USCITA
                        ),

                    ore:
                        testo(
                            riga.ORE
                        )

                });

        }
    );

}

/* ============================================================
   CARICA RICHIESTE
   ============================================================ */

function caricaRichiesteSalvate(workbook) {

    richieste = [];


    const ws =
        workbook.Sheets[
            "APP_RICHIESTE"
        ];


    if (ws) {

        const dati =
            XLSX.utils.sheet_to_json(
                ws,
                {
                    defval: "",
                    raw: false
                }
            );


        dati.forEach(
            function(riga) {

                richieste.push({

                    id:
                        testo(riga.ID) ||
                        generaIdTurno(),

                    tipo:
                        testo(riga.TIPO),

                    operatore:
                        testo(riga.OPERATORE),

                    data:
                        testo(riga.DATA),

                    dal:
                        testo(riga.DAL),

                    al:
                        testo(riga.AL),

                    postazione:
                        testo(riga.POSTAZIONE),

                    turno:
                        testo(riga.TURNO),

                    destinatario:
                        testo(riga.DESTINATARIO),

                    turnoDestinazione:
                        testo(riga.TURNO_DESTINAZIONE),

                    turnoId:
                        testo(riga.TURNO_ID),

                    turnoDestId:
                        testo(riga.TURNO_DEST_ID),

                    note:
                        testo(riga.NOTE),

                    stato:
                        testo(riga.STATO) ||
                        "IN ATTESA",

                    dataRichiesta:
                        testo(
                            riga.DATA_RICHIESTA
                        )

                });

            }
        );

    }


    try {

        const locali =
            JSON.parse(
                localStorage.getItem(
                    CHIAVE_RICHIESTE
                ) || "[]"
            );


        locali.forEach(
            function(r) {

                const esiste =
                    richieste.some(
                        function(x) {
                            return x.id === r.id;
                        }
                    );

                if (!esiste) {
                    richieste.push(r);
                }

            }
        );

    }
    catch(e) {

        console.warn(
            "Impossibile leggere le richieste locali.",
            e
        );

    }


    salvaRichiesteLocali();

}


/* ============================================================
   SALVA RICHIESTE LOCALMENTE
   ============================================================ */

function salvaRichiesteLocali() {

    try {

        localStorage.setItem(
            CHIAVE_RICHIESTE,
            JSON.stringify(
                richieste
            )
        );

    }
    catch(e) {

        console.warn(
            "Impossibile salvare richieste locali.",
            e
        );

    }

}

function salvaVisualizzazione() {

    try {

        localStorage.setItem(
            CHIAVE_VISUALIZZAZIONE,
            JSON.stringify({

                modalita:
                    modalita,

                offsetSettimana:
                    offsetSettimana,

                offsetGiorno:
                    offsetGiorno,

                filtroPostazione:
                    filtroPostazione

            })
        );

    }
    catch(e) {}

}


function caricaVisualizzazioneSalvata() {

    try {

        const dati =
            JSON.parse(
                localStorage.getItem(
                    CHIAVE_VISUALIZZAZIONE
                ) || "null"
            );


        if (!dati) {
            return;
        }


        /*
           L'operatore non può andare oltre
           la settimana precedente o successiva.
        */

        modalita =
            ["giorno", "mese"].indexOf(dati.modalita) !== -1
                ? dati.modalita
                : "settimana";


        offsetSettimana =
            Math.max(
                -1,
                Math.min(
                    1,
                    Number(
                        dati.offsetSettimana
                    ) || 0
                )
            );


        offsetGiorno =
            Math.max(
                -1,
                Math.min(
                    1,
                    Number(
                        dati.offsetGiorno
                    ) || 0
                )
            );


        filtroPostazione =
            postazioni.some(function(p) { return p.id === dati.filtroPostazione; })
                ? dati.filtroPostazione
                : "tutte";

    }
    catch(e) {}

}

function getPdfOperatoriLocali() {

    try {

        const dati =
            JSON.parse(
                localStorage.getItem(
                    CHIAVE_PDF_OPERATORI
                ) || "{}"
            );

        if (
            dati &&
            typeof dati === "object"
        ) {

            return dati;

        }

    }
    catch(e) {}

    return {};

}


function salvaPdfOperatori(dati) {

    try {

        localStorage.setItem(
            CHIAVE_PDF_OPERATORI,
            JSON.stringify(dati)
        );

        return true;

    }
    catch(e) {

        alert(
            "IMPOSSIBILE SALVARE IL PDF.\n\n" +
            "Il file è probabilmente troppo grande " +
            "per essere conservato nel browser.\n" +
            "Prova con un PDF più leggero (es. sotto 1-2 MB)."
        );

        return false;

    }

}


function caricaPdfPerOperatore(
    nomeOperatore,
    inputId
) {

    const input =
        document.getElementById(
            inputId
        );

    if (
        !input ||
        !input.files ||
        !input.files[0]
    ) {

        alert(
            "Seleziona prima un file PDF."
        );

        return;

    }

    const file =
        input.files[0];

    if (
        !/\.pdf$/i.test(
            file.name
        )
    ) {

        alert(
            "Il file deve essere un PDF."
        );

        return;

    }

    const lettore =
        new FileReader();

    lettore.onload =
        function() {

            const archivio =
                getPdfOperatori();

            archivio[
                normalizza(nomeOperatore)
            ] = {

                nome:
                    nomeOperatore,

                nomeFile:
                    file.name,

                dataUrl:
                    lettore.result,

                caricatoIl:
                    new Date()
                        .toLocaleString("it-IT")

            };

            const salvato =
                salvaPdfOperatori(
                    archivio
                );

            if (salvato) {

                alert(
                    "PDF caricato per " +
                    nomeOperatore + "."
                );

                renderElencoOperatoriPin();

            }

        };

    lettore.onerror =
        function() {

            alert(
                "Errore durante la lettura del PDF."
            );

        };

    lettore.readAsDataURL(
        file
    );

}


function eliminaPdfOperatore(nomeOperatore) {

    if (!confirm(
        "Rimuovere il PDF caricato per " +
        nomeOperatore + "?"
    )) {
        return;
    }

    const archivio =
        getPdfOperatori();

    delete archivio[normalizza(nomeOperatore)];
    delete pdfDaFile[normalizza(nomeOperatore)];

    salvaPdfOperatori(
        archivio
    );

    renderElencoOperatoriPin();

}


function apriPdfOperatoreCorrente() {

    if (!operatoreCorrente) {
        return;
    }

    const archivio =
        getPdfOperatori();

    const voce =
        archivio[
            normalizza(operatoreCorrente)
        ];

    if (!voce) {
        apriPdfDaCartella(operatoreCorrente);
        return;
    }

    const link =
        document.createElement(
            "a"
        );

    link.href =
        voce.dataUrl;

    link.download =
        voce.nomeFile ||
        (operatoreCorrente + ".pdf");

    link.target =
        "_blank";

    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );

}

/* ============================================================
   LEGGI DATA
   ============================================================ */

function dataDaSeriale(v) {

    if (!isFinite(v) || v < 30000 || v > 80000) {
        return null;
    }

    const d = new Date(Math.round((v - 25569) * 86400 * 1000));

    return formatData(
        new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())
    );

}


function leggiData(valore) {

    if (typeof valore === "number") {
        return dataDaSeriale(valore);
    }


    if (
        valore instanceof Date &&
        !isNaN(valore)
    ) {

        return formatData(
            valore
        );

    }


    let s =
        testo(valore);


    if (!s) {
        return null;
    }


    if (/^\d{5}(\.\d+)?$/.test(s)) {
        return dataDaSeriale(parseFloat(s));
    }

    s =
        s.replace(
            /\./g,
            "/"
        )
        .trim();


    const match =
        s.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})/
        );


    if (!match) {
        return null;
    }


    let giorno =
        parseInt(
            match[1],
            10
        );


    let mese =
        parseInt(
            match[2],
            10
        );


    let anno =
        parseInt(
            match[3],
            10
        );


    if (
        anno < 100
    ) {

        anno += 2000;

    }


    const d =
        new Date(
            anno,
            mese - 1,
            giorno
        );


    if (
        isNaN(d.getTime())
    ) {

        return null;

    }


    if (
        d.getDate() !== giorno ||
        d.getMonth() !== mese - 1 ||
        d.getFullYear() !== anno
    ) {

        return null;

    }


    return formatData(d);

}


/* ============================================================
   FORMATTA DATA
   ============================================================ */

function formatData(data) {

    const gg =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    const mm =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const aa =
        data.getFullYear();


    return (
        aa +
        "-" +
        mm +
        "-" +
        gg
    );

}


/* ============================================================
   LEGGI ORA
   ============================================================ */

function leggiOra(valore) {

    if (
        valore === null ||
        valore === undefined ||
        valore === ""
    ) {

        return null;

    }


    if (
        typeof valore === "number" &&
        isFinite(valore)
    ) {

        if (valore < 0 || valore >= 1) {
            return null;
        }


        let minuti =
            Math.round(
                valore * 24 * 60
            );


        minuti =
            minuti %
            (24 * 60);


        if (
            minuti < 0
        ) {

            minuti +=
                24 * 60;

        }


        const hh =
            Math.floor(
                minuti / 60
            );


        const mm =
            minuti % 60;


        return (
            String(hh).padStart(2,"0") +
            ":" +
            String(mm).padStart(2,"0")
        );

    }


    let s =
        testo(valore)
            .trim();


    if (!s) {
        return null;
    }


    const match =
        s.match(
            /^(\d{1,2})[:.](\d{2})(?::(\d{2}))?$/
        );


    if (!match) {
        return null;
    }


    const hh =
        parseInt(
            match[1],
            10
        );


    const mm =
        parseInt(
            match[2],
            10
        );


    if (
        hh > 23 ||
        mm > 59
    ) {

        return null;

    }


    return (
        String(hh).padStart(2,"0") +
        ":" +
        String(mm).padStart(2,"0")
    );

}


/* ============================================================
   CALCOLA ORE
   ============================================================ */

function calcolaOre(
    entrata,
    uscita
) {

    if (
        !entrata ||
        !uscita
    ) {

        return "";

    }


    const p1 =
        entrata.split(":");


    const p2 =
        uscita.split(":");


    let m1 =
        parseInt(p1[0],10) * 60 +
        parseInt(p1[1],10);


    let m2 =
        parseInt(p2[0],10) * 60 +
        parseInt(p2[1],10);


    if (
        m2 < m1
    ) {

        m2 +=
            24 * 60;

    }


    const differenza =
        m2 - m1;


    const hh =
        Math.floor(
            differenza / 60
        );


    const mm =
        differenza % 60;


    return (
        String(hh).padStart(2,"0") +
        ":" +
        String(mm).padStart(2,"0")
    );

}


/* ============================================================
   TESTO
   ============================================================ */

function testo(valore) {

    if (
        valore === null ||
        valore === undefined
    ) {

        return "";

    }


    return String(valore)
        .replace(
            /\u00A0/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* ============================================================
   NORMALIZZA
   ============================================================ */

function normalizza(valore) {

    return testo(valore)
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toUpperCase()
        .trim();

}


/* ============================================================
   AGGIUNGI GIORNI
   ============================================================ */

function aggiungiGiorni(
    data,
    giorni
) {

    const d =
        new Date(
            data.getTime()
        );


    d.setDate(
        d.getDate() + giorni

}

            new Date(primo.getFullYear(), primo.getMonth(), g)
        );
    }

}


function visualizza() {

    aggiornaBottoniPostazioni();

    aggiornaSelectOperatori();

    salvaVisualizzazione();


    if (!fileCaricato) {

        document
            .getElementById(
                "risultati"
            )
            .innerHTML =
                "<div class='nessun-turno'>" +
                "Carica prima il file Excel." +
                "</div>";

        return;

    }


    if (modalita === "mese") {

        visualizzaMese();

    }
    else if (modalita === "giorno") {

        visualizzaGiorno();

    }
    else {

        visualizzaSettimana();

    }

}


/* ============================================================
   VISUALIZZA SETTIMANA
   ============================================================ */

function visualizzaSettimana() {

    const contenitore =
        document.getElementById(
            "risultati"
        );


    contenitore.innerHTML = "";


    const oggi =
        new Date();


    oggi.setHours(
        0,0,0,0
    );


    const giornoSettimana =
        oggi.getDay();


    const differenzaLunedi =
        giornoSettimana === 0
            ? -6
            : 1 - giornoSettimana;


    const lunedi =
        aggiungiGiorni(
            oggi,
            differenzaLunedi +
            offsetSettimana * 7
        );


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const data =
            aggiungiGiorni(
                lunedi,
                i
            );


        creaGiorno(
            contenitore,
            data
        );

    }

}

/* ============================================================
   TROVA TURNO
   ============================================================ */

function trovaTurno(
    data,
    postazioneId,
    turnoId
) {

    if (
        !turni[data] ||
        !turni[data][postazioneId]
    ) {

        return null;

    }


    return turni[data][postazioneId]
        .find(
            function(t) {

                return t.id === turnoId;

            }
        ) || null;

}


/* ============================================================
   TROVA TURNO PER ID
   ============================================================ */

function trovaTurnoPerId(
    turnoId
) {

    for (
        const data in turni
    ) {

        for (
            const postazioneId in turni[data]
        ) {

            const lista =
                turni[data][postazioneId];


            const turno =
                lista.find(
                    function(t) {

                        return t.id === turnoId;

                    }
                );


            if (turno) {

                return {

                    data:
                        data,

                    postazioneId:
                        postazioneId,

                    turno:
                        turno

                };

            }

        }

    }


    return null;

}


/* ============================================================
   CREA GIORNO
   ============================================================ */

function creaGiorno(
    contenitore,
    data
) {

    const chiave =
        formatData(data);


    const giorno =
        document.createElement(
            "div"
        );


    giorno.className =
        "giorno";


    const titolo =
        document.createElement(
            "div"
        );


    titolo.className =
        "giorno-titolo";


    titolo.textContent =
        nomeGiorno(data) +
        " " +
        dataVisualizzazione(data);


    giorno.appendChild(
        titolo
    );


    let qualcosaAggiunto =
        false;

    for (
        let i = 0;
        i < postazioni.length;
        i++
    ) {

        if (
            filtroPostazione !== "tutte" &&
            postazioni[i].id !== filtroPostazione
        ) {
            continue;
        }

        const aggiunto =
            creaPostazione(
                giorno,
                chiave,
                postazioni[i]
            );

        if (aggiunto) {

            qualcosaAggiunto =
                true;

        }

    }


    if (
        nomeFiltroOperatore() &&
        !qualcosaAggiunto
    ) {

        const nessunoPersonale =
            document.createElement(
                "div"
            );

        nessunoPersonale.className =
            "nessun-turno";

        nessunoPersonale.style.padding =
            "18px";

        nessunoPersonale.textContent =
            (modalitaPersonale
                ? "NESSUN TURNO PER TE IN QUESTO GIORNO"
                : "NESSUN TURNO PER " + nomeFiltroOperatore().toUpperCase());

        giorno.appendChild(
            nessunoPersonale
        );

    }


    contenitore.appendChild(
        giorno
    );

}


/* ============================================================
   CREA BOX ASSENZE (riutilizzabile anche se il sito è chiuso)
   ============================================================ */

function creaBoxAssenze(
    data,
    postazioneId
) {

    let listaAssenze =
        assenze[data] &&
        assenze[data]
            [postazioneId]
            ? assenze[data]
                [postazioneId]
            : [];
    if (modalitaPersonale && operatoreCorrente) {
        listaAssenze = listaAssenze.filter(function(a) {
            return normalizza(a.nome) === normalizza(operatoreCorrente);
        });
    }


    if (
        listaAssenze.length === 0
    ) {

        return null;

    }


    const boxAssenze =
        document.createElement(
            "div"
        );


    boxAssenze.className =
        "assenze";


    const titoloAssenze =
        document.createElement(
            "div"
        );


    titoloAssenze.className =
        "assenze-titolo";


    titoloAssenze.textContent =
        "ASSENTI";


    boxAssenze.appendChild(
        titoloAssenze
    );


    listaAssenze.forEach(
        function(assente) {

            const riga =
                document.createElement(
                    "div"
                );


            riga.className =
                "assente";


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "assente-nome";


            nome.textContent =
                assente.nome;


            const tipo =
                document.createElement(
                    "div"
                );


            tipo.className =
                "assente-tipo";


            tipo.textContent =
                assente.tipo;


            riga.appendChild(
                nome
            );


            riga.appendChild(
                tipo
            );


            boxAssenze.appendChild(
                riga
            );

        }
    );


    return boxAssenze;

}


/* ============================================================
   CREA POSTAZIONE
   ============================================================ */

function creaPostazione(
    contenitore,
    data,
    postazione
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "postazione";


    const titolo =
        document.createElement(
            "div"
        );


    titolo.className =
        "postazione-titolo";


    titolo.textContent =
        postazione.nome;


    box.appendChild(
        titolo
    );


    if (
        chiusure[data] &&
        chiusure[data]
            [postazione.id]
    ) {

        if (nomeFiltroOperatore()) {

            /*
               In vista personale non mostriamo
               le postazioni chiuse: non sono
               riferibili al singolo operatore.
            */

            return false;

        }


        const chiuso =
            document.createElement(
                "div"
            );


        chiuso.className =
            "chiuso";


        chiuso.textContent =
            "SITO CHIUSO";


        box.appendChild(
            chiuso
        );


        const boxAssenzeChiuso =
            creaBoxAssenze(
                data,
                postazione.id
            );


        if (
            boxAssenzeChiuso
        ) {

            box.appendChild(
                boxAssenzeChiuso
            );

        }


        contenitore.appendChild(
            box
        );


        return true;

    }


    let lista =
        turni[data] &&
        turni[data]
            [postazione.id]
            ? turni[data]
                [postazione.id]
            : [];


    if (
        nomeFiltroOperatore()
    ) {

        lista =
            lista.filter(
                function(t) {

                    return normalizza(t.nome) ===
                        normalizza(nomeFiltroOperatore());

                }
            );


        if (
            lista.length === 0
        ) {

            /*
               Nessun turno per questo operatore
               in questa postazione: non mostriamo
               la card per non fare confusione.
            */

            return false;

        }

    }


    if (
        lista.length === 0
    ) {

        const nessuno =
            document.createElement(
                "div"
            );


        nessuno.className =
            "nessun-turno";


        nessuno.textContent =
            "NESSUN TURNO";


        box.appendChild(
            nessuno
        );

    }

    else {

        lista.forEach(
            function(turno) {

                const riga =
                    document.createElement(
                        "div"
                    );


                riga.className =
                    "turno";


                const nome =
                    document.createElement(
                        "div"
                    );


                nome.className =
                    "turno-nome";


                nome.textContent =
                    turno.nome;


                const entrata =
                    document.createElement(
                        "div"
                    );


                entrata.className =
                    "turno-ora";


                entrata.textContent =
                    turno.entrata;


                const uscita =
                    document.createElement(
                        "div"
                    );


                uscita.className =
                    "turno-ora";


                uscita.textContent =
                    turno.uscita;


                const ore =
                    document.createElement(
                        "div"
                    );


                ore.className =
                    "turno-ore";


                ore.textContent =
                    turno.ore ||
                    "";


                riga.appendChild(
                    nome
                );

                riga.appendChild(
                    entrata
                );

                riga.appendChild(
                    uscita
                );

                riga.appendChild(
                    ore
                );


                if (amministratore) {

                    const azioni =
                        document.createElement(
                            "div"
                        );


                    azioni.className =
                        "turno-azioni";


                    const modifica =
                        document.createElement(
                            "button"
                        );


                    modifica.className =
                        "btn-modifica";


                    modifica.textContent =
                        "✏️";


                    modifica.title =
                        "Modifica turno";


                    modifica.onclick =
                        function() {

                            apriModificaTurno(
                                data,
                                postazione.id,
                                turno.id
                            );

                        };


                    const elimina =
                        document.createElement(
                            "button"
                        );


                    elimina.className =
                        "btn-elimina";


                    elimina.textContent =
                        "🗑";


                    elimina.title =
                        "Elimina turno";


                    elimina.onclick =
                        function() {

                            eliminaTurno(
                                data,
                                postazione.id,
                                turno.id
                            );

                        };


                    azioni.appendChild(
                        modifica
                    );


                    azioni.appendChild(
                        elimina
                    );


                    riga.appendChild(
                        azioni
                    );

                }


                box.appendChild(
                    riga
                );

            }
        );

    }


    const boxAssenze =
        creaBoxAssenze(
            data,
            postazione.id
        );


    if (
        boxAssenze
    ) {

        box.appendChild(
            boxAssenze
        );

    }


    /* --------------------------------------------------------
       SEGNALA CAMBI TURNO APPROVATI
       -------------------------------------------------------- */

    const cambi =
        richieste.filter(
            function(r) {

                const corrisponde =
                    r.tipo === "CAMBIO TURNO" &&
                    r.stato === "APPROVATA" &&
                    r.data === data;

                if (
                    !corrisponde ||
                    !modalitaPersonale ||
                    !operatoreCorrente
                ) {

                    return corrisponde;

                }

                return (
                    normalizza(r.operatore) ===
                        normalizza(operatoreCorrente) ||
                    normalizza(r.destinatario) ===
                        normalizza(operatoreCorrente)
                );

            }
        );


    cambi.forEach(
        function(cambio) {

            const segnale =
                document.createElement(
                    "div"
                );


            segnale.className =
                "cambio-segnale";


            segnale.textContent =
                "🔔 CAMBIO TURNO: " +
                cambio.operatore +
                (
                    cambio.destinatario
                        ? " ↔ " +
                          cambio.destinatario
                        : ""
                );


            box.appendChild(
                segnale
            );

        }
    );


    contenitore.appendChild(
        box
    );


    return true;

}

function salvaModificaTurno(
    vecchiaData,
    vecchiaPostazione,
    turnoId
) {

    const nuovaData =
        testo(
            document.getElementById(
                "modData"
            ).value
        );


    const nuovaPostazione =
        testo(
            document.getElementById(
                "modPostazione"
            ).value
        );


    const nome =
        testo(
            document.getElementById(
                "modNome"
            ).value
        );


    const entrata =
        testo(
            document.getElementById(
                "modEntrata"
            ).value
        );


    const uscita =
        testo(
            document.getElementById(
                "modUscita"
            ).value
        );


    if (
        !nuovaData ||
        !nuovaPostazione ||
        !nome ||
        !entrata ||
        !uscita
    ) {

        alert(
            "Compila tutti i campi."
        );

        return;

    }


    const turno =
        trovaTurno(
            vecchiaData,
            vecchiaPostazione,
            turnoId
        );


    if (!turno) {

        alert(
            "Turno non trovato."
        );

        return;

    }


    turni[vecchiaData]
        [vecchiaPostazione] =
        turni[vecchiaData]
            [vecchiaPostazione]
            .filter(
                function(t) {
                    return t.id !== turnoId;
                }
            );


    if (
        turni[vecchiaData]
            [vecchiaPostazione]
            .length === 0
    ) {

        delete turni[vecchiaData]
            [vecchiaPostazione];

    }


    if (
        !turni[nuovaData]
    ) {

        turni[nuovaData] = {};

    }


    if (
        !turni[nuovaData]
            [nuovaPostazione]
    ) {

        turni[nuovaData]
            [nuovaPostazione] = [];

    }


    turni[nuovaData]
        [nuovaPostazione]
        .push({

            id:
                turnoId,

            nome:
                nome,

            entrata:
                entrata,

            uscita:
                uscita,

            ore:
                calcolaOre(
                    entrata,
                    uscita
                )

        });


    salvaDatiLocali();

    chiudiModal();

    visualizza();

}

function eliminaTurno(
    data,
    postazioneId,
    turnoId
) {

    const turno =
        trovaTurno(
            data,
            postazioneId,
            turnoId
        );


    if (!turno) {
        return;
    }


    const conferma =
        confirm(
            "Vuoi eliminare il turno di " +
            turno.nome +
            "?"
        );


    if (!conferma) {
        return;
    }


    turni[data][postazioneId] =
        turni[data][postazioneId]
            .filter(
                function(t) {
                    return t.id !== turnoId;
                }
            );


    salvaDatiLocali();

    visualizza();

}

function aggiornaContatoriRichieste() {

    const mappaSpan = {

        FERIE: "numFerie",

        104: "num104",

        MALATTIA: "numMalattia",

        ALTRO: "numAltro",

        CAMBIO: "numCambio"

    };


    Object.keys(
        TIPI_RICHIESTA_PER_CATEGORIA
    ).forEach(
        function(categoria) {

            const tipiValidi =
                TIPI_RICHIESTA_PER_CATEGORIA[
                    categoria
                ];


            const numero =
                richieste.filter(
                    function(r) {

                        return (
                            r.stato === "IN ATTESA" &&
                            tipiValidi.indexOf(r.tipo) !== -1
                        );

                    }
                ).length;


            const elemento =
                document.getElementById(
                    mappaSpan[categoria]
                );


            if (!elemento) {
                return;
            }


            elemento.innerHTML =
                numero > 0
                    ? `<span class="notifica">${numero}</span>`
                    : "";

        }
    );

}


function apriRichieste(tipoFiltro) {

    if (!amministratore) {
        return;
    }


    filtroRichiesteAttuale =
        tipoFiltro || null;


    const tipiValidi =
        tipoFiltro
            ? TIPI_RICHIESTA_PER_CATEGORIA[tipoFiltro]
            : null;


    const elenco =
        tipiValidi
            ? richieste.filter(
                function(r) {
                    return tipiValidi.indexOf(r.tipo) !== -1;
                }
            )
            : richieste;


    let html = "";


    if (
        elenco.length === 0
    ) {

        html =
            "<p>Nessuna richiesta presente.</p>";

    }

    else {

        elenco
            .slice()
            .reverse()
            .forEach(
                function(r) {

                    const classe =
                        r.stato ===
                        "APPROVATA"
                            ? "approvata"
                            : r.stato ===
                              "RIFIUTATA"
                                ? "rifiutata"
                                : "in-attesa";


                    html += `

                    <div class="richiesta-card ${classe}">

                        <h3>
                            ${escapeHtml(r.tipo)}
                        </h3>

                        <p>
                            <strong>Operatore:</strong>
                            ${escapeHtml(r.operatore)}
                        </p>

                        ${
                            r.dal
                                ? `
                                <p>
                                    <strong>Dal:</strong>
                                    ${escapeHtml(r.dal)}
                                    &nbsp;
                                    <strong>Al:</strong>
                                    ${escapeHtml(r.al)}
                                </p>
                                `
                                : ""
                        }

                        ${
                            r.data
                                ? `
                                <p>
                                    <strong>Data:</strong>
                                    ${escapeHtml(r.data)}
                                </p>
                                `
                                : ""
                        }

                        ${
                            r.destinatario
                                ? `
                                <p>
                                    <strong>Cambio con:</strong>
                                    ${escapeHtml(r.destinatario)}
                                </p>
                                `
                                : ""
                        }

                        ${
                            r.note
                                ? `
                                <p>
                                    <strong>Note:</strong>
                                    ${escapeHtml(r.note)}
                                </p>
                                `
                                : ""
                        }

                        <p>
                            <strong>Stato:</strong>
                            ${escapeHtml(r.stato)}
                        </p>

                        <p>
                            <strong>Richiesta:</strong>
                            ${escapeHtml(r.dataRichiesta)}
                        </p>

                        ${
                            r.stato === "IN ATTESA"
                                ? `
                                <div class="modal-buttons">

                                    <button
                                        class="btn-salva"
                                        onclick="approvaRichiesta('${escapeHtml(r.id)}')">
                                        ✅ APPROVA
                                    </button>

                                    <button
                                        class="btn-elimina"
                                        onclick="rifiutaRichiesta('${escapeHtml(r.id)}')">
                                        ❌ RIFIUTA
                                    </button>

                                </div>
                                `
                                : ""
                        }

                    </div>

                    `;

                }
            );

    }


    apriModal(
        "📋 RICHIESTE",
        html
    );

}


/* ============================================================
   APPROVA RICHIESTA
   ============================================================ */

function approvaRichiesta(
    id
) {

    const richiesta =
        richieste.find(
            function(r) {
                return r.id === id;
            }
        );


    if (!richiesta) {
        return;
    }


    if (
        richiesta.tipo ===
        "CAMBIO TURNO"
    ) {

        const a =
            trovaTurnoPerId(
                richiesta.turnoId
            );


        const b =
            trovaTurnoPerId(
                richiesta.turnoDestId
            );


        if (
            a &&
            b
        ) {

            const nomeA =
                a.turno.nome;


            const nomeB =
                b.turno.nome;


            a.turno.nome =
                nomeB;


            b.turno.nome =
                nomeA;


            salvaDatiLocali();

        }

    }


    richiesta.stato =
        "APPROVATA";


    salvaRichiesteLocali();

    aggiornaContatoriRichieste();

    apriRichieste(filtroRichiesteAttuale);

    visualizza();

}


/* ============================================================
   RIFIUTA
   ============================================================ */

function rifiutaRichiesta(
    id
) {

    const richiesta =
        richieste.find(
            function(r) {
                return r.id === id;
            }
        );


    if (!richiesta) {
        return;
    }


    richiesta.stato =
        "RIFIUTATA";


    salvaRichiesteLocali();

    aggiornaContatoriRichieste();

    apriRichieste(filtroRichiesteAttuale);

}

document
    .getElementById(
        "btnSalva"
    )
    .addEventListener(
        "click",
        salvaExcel
    );


function salvaExcel() {

    if (!amministratore) {

        alert(
            "Solo l'amministratore può salvare."
        );

        return;

    }


    if (!workbookCaricato) {

        /*
           Se i turni provengono dal salvataggio
           locale (localStorage) e non da un Excel
           caricato in questa sessione, si crea un
           workbook nuovo così il salvataggio
           funziona comunque.
        */

        workbookCaricato =
            XLSX.utils.book_new();

    }


    /*
       ---------------------------------------------------------
       APP_TURNI
       ---------------------------------------------------------
    */

    const righeTurni = [];


    for (
        const data in turni
    ) {

        for (
            const postazioneId in
            turni[data]
        ) {

            turni[data][postazioneId]
                .forEach(
                    function(t) {

                        righeTurni.push({

                            DATA:
                                data,

                            POSTAZIONE:
                                postazioneId,

                            NOME:
                                t.nome,

                            ENTRATA:
                                t.entrata,

                            USCITA:
                                t.uscita,

                            ORE:
                                t.ore,

                            ID:
                                t.id

                        });

                    }
                );

        }

    }


    const wsTurni =
        XLSX.utils.json_to_sheet(
            righeTurni
        );


    sostituisciFoglio(
        workbookCaricato,
        "APP_TURNI",
        wsTurni
    );


    /*
       ---------------------------------------------------------
       APP_ASSENZE
       ---------------------------------------------------------
    */

    const righeAssenze = [];


    for (
        const data in assenze
    ) {

        for (
            const postazioneId in
            assenze[data]
        ) {

            assenze[data][postazioneId]
                .forEach(
                    function(a) {

                        righeAssenze.push({

                            DATA:
                                data,

                            POSTAZIONE:
                                postazioneId,

                            NOME:
                                a.nome,

                            TIPO:
                                a.tipo

                        });

                    }
                );

        }

    }


    const wsAssenze =
        XLSX.utils.json_to_sheet(
            righeAssenze
        );


    sostituisciFoglio(
        workbookCaricato,
        "APP_ASSENZE",
        wsAssenze
    );


    /*
       ---------------------------------------------------------
       APP_RICHIESTE
       ---------------------------------------------------------
    */

    const righeRichieste =
        richieste.map(
            function(r) {

                return {

                    ID:
                        r.id,

                    TIPO:
                        r.tipo,

                    OPERATORE:
                        r.operatore,

                    DATA:
                        r.data,

                    DAL:
                        r.dal,

                    AL:
                        r.al,

                    POSTAZIONE:
                        r.postazione,

                    TURNO:
                        r.turno,

                    DESTINATARIO:
                        r.destinatario,

                    TURNO_DESTINAZIONE:
                        r.turnoDestinazione,

                    TURNO_ID:
                        r.turnoId,

                    TURNO_DEST_ID:
                        r.turnoDestId,

                    NOTE:
                        r.note,

                    STATO:
                        r.stato,

                    DATA_RICHIESTA:
                        r.dataRichiesta

                };

            }
        );


    const wsRichieste =
        XLSX.utils.json_to_sheet(
            righeRichieste
        );


    sostituisciFoglio(
        workbookCaricato,
        "APP_RICHIESTE",
        wsRichieste
    );
    scriviOperatoriEPdfNelWorkbook(workbookCaricato);


    /*
       ---------------------------------------------------------
       SALVATAGGIO FILE
       ---------------------------------------------------------
    */

    let base =
        (nomeFileOriginale || "Turni")
            .replace(
                /\.(xlsx|xlsm|xls)$/i,
                ""
            );


    let estensione =
        /\.xlsm$/i.test(
            nomeFileOriginale
        )
            ? ".xlsm"
            : ".xlsx";


    if (
        /\.xls$/i.test(
            nomeFileOriginale
        )
    ) {

        estensione =
            ".xlsx";

    }


    const oggi =
        new Date();


    const stamp =
        oggi.getFullYear() +
        String(
            oggi.getMonth() + 1
        ).padStart(2,"0") +
        String(
            oggi.getDate()
        ).padStart(2,"0");


    const nomeSalvataggio =
        base +
        "_AGGIORNATO_" +
        stamp +
        estensione;


    try {

        XLSX.writeFile(
            workbookCaricato,
            nomeSalvataggio,
            {

                bookType:
                    estensione === ".xlsm"
                        ? "xlsm"
                        : "xlsx",

                bookVBA:
                    true

            }
        );


        document
            .getElementById(
                "stato"
            )
            .textContent =
                "FILE SALVATO: " +
                nomeSalvataggio;


        alert(
            "SALVATAGGIO COMPLETATO.\n\n" +
            nomeSalvataggio +
            "\n\n" +
            "Dentro ci sono turni, RICHIESTE, OPERATORI/PIN e PDF.\n" +
            "Carica questo file al posto del vecchio Excel online: " +
            "da quel momento lo vedranno tutti."
        );

    }
    catch(e) {

        console.error(e);

        alert(
            "Errore durante il salvataggio del file.\n\n" +
            e.message
        );

    }

}

function sostituisciFoglio(
    workbook,
    nomeFoglio,
    worksheet
) {

    const indice =
        workbook.SheetNames.indexOf(
            nomeFoglio
        );


    if (indice !== -1) {

        workbook.SheetNames.splice(
            indice,
            1
        );

        delete workbook.Sheets[
            nomeFoglio
        ];

    }


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        nomeFoglio
    );

}

let pdfDaFile = {};
const DIM_PARTE_PDF = 30000;

function getPdfOperatori() {
    return Object.assign({}, pdfDaFile, getPdfOperatoriLocali());
}

function richiesteComeRighe() {
    return richieste.map(function(r) {
        return {
            ID: r.id, TIPO: r.tipo, OPERATORE: r.operatore,
            DATA: r.data, DAL: r.dal, AL: r.al,
            POSTAZIONE: r.postazione, TURNO: r.turno,
            DESTINATARIO: r.destinatario,
            TURNO_DESTINAZIONE: r.turnoDestinazione,

            NOTE: r.note, STATO: r.stato,
            DATA_RICHIESTA: r.dataRichiesta
        };
    });
}

function rigaARichiesta(riga) {
    return {
        id: testo(riga.ID) || generaIdTurno(),
        tipo: testo(riga.TIPO), operatore: testo(riga.OPERATORE),
        data: testo(riga.DATA), dal: testo(riga.DAL), al: testo(riga.AL),
        postazione: testo(riga.POSTAZIONE), turno: testo(riga.TURNO),
        destinatario: testo(riga.DESTINATARIO),
        turnoDestinazione: testo(riga.TURNO_DESTINAZIONE),
        turnoId: testo(riga.TURNO_ID), turnoDestId: testo(riga.TURNO_DEST_ID),
        note: testo(riga.NOTE),
        stato: testo(riga.STATO) || "IN ATTESA",
        dataRichiesta: testo(riga.DATA_RICHIESTA)
    };
}

function scriviOperatoriEPdfNelWorkbook(wb) {
    const ops = getOperatoriPin().map(function(o) {
        return { NOME: o.nome, PIN: o.pin };
    });
    sostituisciFoglio(wb, "APP_OPERATORI",
        XLSX.utils.json_to_sheet(ops, { header: ["NOME", "PIN"] }));

    const archivio = getPdfOperatori();
    const righe = [];
    Object.keys(archivio).forEach(function(k) {
        const v = archivio[k];
        const s = v.dataUrl || "";
        if (!s) { return; }
        const parti = Math.max(1, Math.ceil(s.length / DIM_PARTE_PDF));
        for (let i = 0; i < parti; i++) {
            righe.push({
                CHIAVE: k, NOME: v.nome, NOME_FILE: v.nomeFile,
                CARICATO_IL: v.caricatoIl,
                PARTE: i + 1, TOTALE_PARTI: parti,
                DATI: s.substr(i * DIM_PARTE_PDF, DIM_PARTE_PDF)
            });
        }
    });
    sostituisciFoglio(wb, "APP_PDF",
        XLSX.utils.json_to_sheet(righe, {
            header: ["CHIAVE","NOME","NOME_FILE","CARICATO_IL","PARTE","TOTALE_PARTI","DATI"]
        }));
}

function caricaOperatoriEPdfDalWorkbook(wb) {
    try {
        const wsO = wb.Sheets["APP_OPERATORI"];
        if (wsO) {
            const lista = getOperatoriPin();
            XLSX.utils.sheet_to_json(wsO, { defval: "", raw: false })
                .forEach(function(r) {
                    const nome = testo(r.NOME);
                    const pin = testo(r.PIN);
                    if (!nome || !pin) { return; }
                    const esiste = lista.some(function(o) {
                        return normalizza(o.nome) === normalizza(nome);
                    });
                    if (!esiste) { lista.push({ nome: nome, pin: pin }); }
                });
            try { localStorage.setItem(CHIAVE_OPERATORI, JSON.stringify(lista)); }
            catch (e) {}
        }
        const wsP = wb.Sheets["APP_PDF"];
        if (wsP) {
            const gruppi = {};
            XLSX.utils.sheet_to_json(wsP, { defval: "", raw: false })
                .forEach(function(r) {
                    const k = String(r.CHIAVE || "").trim();
                    if (!k) { return; }
                    if (!gruppi[k]) {
                        gruppi[k] = { meta: r, parti: {},
                                      tot: Number(r.TOTALE_PARTI) || 1 };
                    }
                    gruppi[k].parti[Number(r.PARTE) || 1] = String(r.DATI || "");
                });
            const nuovi = {};
            Object.keys(gruppi).forEach(function(k) {
                const g = gruppi[k];
                let s = "";
                for (let i = 1; i <= g.tot; i++) {
                    if (g.parti[i] === undefined) { s = ""; break; }
                    s += g.parti[i];
                }
                if (s) {
                    nuovi[k] = {
                        nome: String(g.meta.NOME || k),
                        nomeFile: String(g.meta.NOME_FILE || (k + ".pdf")),
                        dataUrl: s,
                        caricatoIl: String(g.meta.CARICATO_IL || "")
                    };
                }
            });
            pdfDaFile = nuovi;
        }
    } catch (e) {
        console.warn("Lettura operatori/PDF dal file non riuscita.", e);
    }
}

function esportaMieRichieste() {
    if (!richieste.length) {
        alert("Non ci sono richieste da esportare.");
        return;
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(
        wb, XLSX.utils.json_to_sheet(richiesteComeRighe()), "APP_RICHIESTE");
    const o = new Date();
    const stamp = o.getFullYear() +
        String(o.getMonth() + 1).padStart(2, "0") +
        String(o.getDate()).padStart(2, "0");
    XLSX.writeFile(wb, "RICHIESTE_" + stamp + ".xlsx");
}

function importaRichiesteDaExcel(event) {
    const files = Array.from(event.target.files || []);
    if (!files.length) { return; }
    let lette = 0, aggiunte = 0;
    Promise.all(files.map(function(f) {
        return f.arrayBuffer().then(function(buf) {
            const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
            const ws = wb.Sheets["APP_RICHIESTE"];
            if (!ws) { return; }
            XLSX.utils.sheet_to_json(ws, { defval: "", raw: false })
                .forEach(function(riga) {
                    const id = testo(riga.ID);
                    if (!id) { return; }
                    lette++;
                    if (richieste.some(function(x) { return x.id === id; })) { return; }
                    richieste.push(rigaARichiesta(riga));
                    aggiunte++;
                });
        });
    })).then(function() {
        salvaRichiesteLocali();
        aggiornaContatoriRichieste();
        visualizza();
        alert("Richieste lette: " + lette + "\nNuove aggiunte: " + aggiunte +
              (aggiunte ? "\n\nPremi 💾 SALVA per scriverle nel file Excel." : ""));
        event.target.value = "";
    }).catch(function(e) {
        alert("Errore nella lettura del file: " + e.message);
    });
}
